name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run check

      - name: Extract changelog entry
        id: notes
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
          const heading = new RegExp(`^## \\[?${tag.replace(/\./g, "\\.")}\\]?`, "m");
          const match = heading.exec(changelog);
          let body = "";
          if (match) {
            const rest = changelog.slice(match.index + match[0].length);
            const next = rest.search(/\n## /);
            body = (next === -1 ? rest : rest.slice(0, next)).trim();
          }
          fs.writeFileSync("RELEASE_NOTES.md", body || `Release ${process.env.GITHUB_REF_NAME}`);
          NODE

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          generate_release_notes: false