name: lepatch-go

services:
  lepatch:
    image: ghcr.io/leleasley/lepatch:${LEPATCH_VERSION:-latest}
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DATABASE_PATH: /app/data/lepatch.sqlite
      DATA_DIR: /app/data
      PORT: 3000
    ports:
      - "${LEPATCH_PORT:-3000}:3000"
    volumes:
      - lepatch-sqlite-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  lepatch-sqlite-data:
    name: lepatch-sqlite-data
